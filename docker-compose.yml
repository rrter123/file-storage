services:
  db:
    image: postgres:18.6
    volumes:
      - postgres_data:/var/lib/postgresql
    environment:
      - POSTGRES_USER=dev_user
      - POSTGRES_PASSWORD=dev_password
      - POSTGRES_DB=dev_db
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U dev_user -d dev_db" ]
      interval: 3s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: app/Dockerfile
    volumes:
      - ./app/:/app/
      - /app/.venv
    ports:
      - 8000:8000
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
